name: EcoMonitor CI Pipeline

# Налаштовуємо запуск перевірок при push та створенні Pull Request у гілку main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      # 1. Завантажуємо код проєкту на віртуальну машину GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Встановлюємо Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Оптимальна версія для Next.js
          cache: 'npm'       # Кешуємо залежності для прискорення CI

      # 3. Встановлюємо залежності (використовуємо ci замість install для чистого встановлення)
      - name: Install dependencies
        run: npm ci

      # 4. Перевірка TypeScript типів (як вимагається в завданні)
      - name: Check TypeScript types
        run: npx tsc --noEmit

      # 5. Автоматична перевірка збірки (Build)
      - name: Build Next.js application
        run: npm run build
        # Додаємо змінні середовища, які можуть знадобитися для білда
        env: 
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}